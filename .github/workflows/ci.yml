# CI for the Forge landing site (forge.equipment).
#
# This repo had NO CI at all. Every other Forge repo has a lane; the one that a
# prospective customer actually reads did not, so the copy standard and the
# build both rested on whoever was editing remembering to check.
#
# The lane is deliberately SMALL. Each step below is here because it can fail
# for a real reason and its failure is actionable. Steps that would be green for
# reasons unrelated to correctness, or red for reasons nobody intends to fix
# today, are listed in the footer with why, rather than added as decoration.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      # The copy standard, enforced instead of remembered. RZ flagged the em
      # dash as the clearest tell that copy was machine-written; Ethan restated
      # it for this repo on 2026-08-12. Same rule as forge-backend's guard,
      # byte for byte: a SPACED U+2014 in text the site renders. Unspaced forms
      # and en-dash ranges ("$5M-$10M") are correct typography and are not
      # flagged. See the script header for the fix shapes.
      - name: No spaced em dashes in rendered copy
        run: node scripts/check-em-dashes.mjs

      - name: Actual pricing source regression tests
        run: npm run test:pricing

      # The text-fit detector's body is byte-identical to its Forge_Web twin
      # (F-631). Forge_Web carries the same test with the same sha256, so an
      # edit to either copy alone turns that repo red until both match.
      - name: Text-fit detector matches its Forge_Web twin
        run: npm run test:detector-twin

      # `tsc --noEmit`. Catches the class this repo is most exposed to: a copy
      # or constant edit that breaks a type nothing else would notice until
      # Vercel built it.
      - name: Typecheck
        run: npx tsc --noEmit

      # `next build` proves every route still renders. It is fast and it
      # catches a broken import or a bad JSX edit that typecheck alone can miss
      # in a server component. Built WITHOUT FORGE_INTERNAL_PAGES, exactly as
      # production (Vercel) builds, so the next step tests what ships.
      - name: Build
        run: npm run build

      # /brand and /design are internal pages that production used to serve
      # publicly (F-662, N10). They are served only by a build made with
      # FORGE_INTERNAL_PAGES=on (an allowlist: unset or any other value hides
      # them; src/lib/internalPages.ts). This is the DENY half: the production
      # build above must answer 404 for both, and 200 for a public page so a
      # server that serves nothing cannot pass. The ADMIT half is the next
      # step, which rebuilds with the variable on and must load both.
      - name: Internal pages are not served by the production build
        run: |
          npx next start -p 3108 > /tmp/next-start-prod.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3108/ && break
            sleep 1
          done
          code() { curl -s -o /dev/null -w "%{http_code}" "http://localhost:3108$1"; }
          fail=0
          [ "$(code /)" = "200" ] || { echo "/ is $(code /), expected 200"; fail=1; }
          for route in /brand /design; do
            got=$(code "$route")
            if [ "$got" = "404" ]; then echo "$route: 404, not served"; else echo "$route: HTTP $got, expected 404"; fail=1; fi
          done
          kill $(lsof -t -iTCP:3108 -sTCP:LISTEN) 2>/dev/null || true
          exit $fail

      # Text fits at every screen width (F-631). RZ's standard: whatever the
      # angle or size of the screen, text fits the space it has. Serves a
      # build and loads every route in src/app (derived from the page.tsx
      # files, so a new page is covered by construction) at 23 portrait widths
      # from 320 to 1920 and three short landscape screens. Fails on a control
      # label broken over lines, text overlapping or touching other text, text
      # clipped without an ellipsis, a page that scrolls sideways, or a route
      # that renders no text at all. Written for the 2026-09-24 header, whose
      # links and buttons wrapped onto two and three lines from 768 to 1024px.
      #
      # It REBUILDS with FORGE_INTERNAL_PAGES=on so /brand and /design are
      # served and stay audited (F-662): the runner derives its routes from
      # the page.tsx files and fails any route that is not 2xx, so dropping
      # the variable here turns this step red rather than quietly skipping
      # the two pages. That is also the admit half of the gate check above.
      # Local: `FORGE_INTERNAL_PAGES=on npm run build`, `npx next start -p
      # 3107`, then
      # `TEXT_FIT_CHANNEL=chrome npm run check:text-fit -- http://localhost:3107`.
      - name: Text fits at every width
        env:
          FORGE_INTERNAL_PAGES: "on"
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npx next start -p 3107 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3107/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3107/ || { echo "next start did not answer on :3107"; cat /tmp/next-start.log; exit 1; }
          npm run check:text-fit -- http://localhost:3107

# ── Deliberately NOT in this lane ─────────────────────────────────────────
#
# `npm run lint`. It reports 20 problems (14 errors, 6 warnings) on a clean
# `origin/main` today, all in files unrelated to any current change:
# AnimatedCounter.tsx, Navbar.tsx, Features.tsx, HexNutScene.tsx,
# brand/page.tsx, design/page.tsx. Adding it as a required step would make
# every PR red on arrival for pre-existing debt, and the predictable response
# to a lane that is always red is to stop reading it. That is worse than not
# having the step.
#
# The honest options are to fix the 20 findings in their own PR and then add
# this step, or to add it with a FLOOR (fail only if the count RISES above the
# recorded baseline) the way Forge_Web's ci:lint gate does. Either is a real
# improvement. Neither is this PR, because adding a guard and simultaneously
# excusing the violations it finds is how an allowlist becomes permanent.
#
# Pricing tests execute src/lib/pricing.ts using the existing TypeScript
# compiler and Node test runner. No additional test framework is required.
